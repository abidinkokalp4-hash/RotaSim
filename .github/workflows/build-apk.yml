name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project
        run: flutter create --platforms=android --org com.rotasim .
      - name: Add Android network and location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions='''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>'''
          if 'android.permission.INTERNET' not in s:
              s=s.replace(marker,permissions)
          p.write_text(s)
          PY
      - name: Configure optional Google Maps key
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -n "$GOOGLE_MAPS_API_KEY" ]; then
            python3 - <<'PY'
            import os
            from pathlib import Path
            p=Path('android/app/src/main/AndroidManifest.xml')
            s=p.read_text()
            key=os.environ.get('GOOGLE_MAPS_API_KEY','')
            tag=f'''<meta-data android:name="com.google.android.geo.API_KEY" android:value="{key}"/>'''
            s=s.replace('<application', '<application', 1)
            pos=s.find('>', s.find('<application'))
            if key and tag not in s:
                s=s[:pos+1]+'\n        '+tag+s[pos+1:]
            p.write_text(s)
            PY
          else
            echo "GOOGLE_MAPS_API_KEY not configured; building with OpenStreetMap/Esri maps."
          fi
      - name: Get dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RotaSim-APK
          path: build/app/outputs/flutter-apk/app-release.apk
